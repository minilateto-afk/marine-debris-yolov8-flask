<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- 設定網頁編碼為 UTF-8，避免中文亂碼 -->
    <meta charset="UTF-8">

    <!-- 設定手機與電腦都能正常縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 網頁標題 -->
    <title>Marine Debris AI Detection</title>

    <!-- 載入自訂 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- 頁面最上方導覽列 -->
    <header class="navbar">
        <!-- 左側網站名稱 -->
        <div class="nav-brand">Marine Debris AI</div>

        <!-- 右側導覽連結 -->
        <nav class="nav-links">
            <a href="{{ url_for('index') }}">首頁</a>
            <a href="{{ url_for('dashboard') }}">統計儀表板</a>
            <a href="{{ url_for('about') }}">專題說明</a>
        </nav>
    </header>

    <!-- 顯示 Flask flash 訊息，例如錯誤提醒 -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="flash-box">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- 主要內容區塊，由其他頁面填入 -->
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <!-- 頁尾 -->
    <footer class="footer">
        <p>基於 YOLOv8 之海洋廢棄物影像偵測與分類統計系統</p>
    </footer>
</body>
</html>
